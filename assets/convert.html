<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convert vless:// to Clash YAML</title>
<link rel="stylesheet" href="/shared.css">
</head>
<body>
<div class="wrap">
  <nav>
    <a href="/">Home</a>
    <a href="/build">Build</a>
    <a href="/convert" class="active">Convert</a>
  </nav>

  <h1>Convert vless:// → Clash YAML</h1>
  <div class="sub">Paste URL vless://, vmess://, trojan:// → output Clash YAML (client-side, no network)</div>

  <div class="card">
    <h2>Input</h2>
    <label>Paste vless:// URLs (satu per baris)</label>
    <textarea id="input" placeholder="vless://uuid@server:443?encryption=none&type=ws...&#10;vless://..."></textarea>
    <button class="btn" id="convertBtn">Convert ke Clash YAML</button>
  </div>

  <div class="card" id="outputCard" style="display:none">
    <h2>Output <span class="ok">✓</span></h2>
    <div class="note" id="summary" style="margin-bottom:8px"></div>
    <label>Clash YAML</label>
    <textarea id="output" readonly></textarea>
    <div class="row">
      <button class="btn" id="copyBtn">Copy YAML</button>
      <button class="btn ghost" id="downloadBtn">Download clash.yaml</button>
    </div>
  </div>

  <div class="card">
    <h2>Info</h2>
    <p class="note">Supported: <code>vless://</code>, <code>vmess://</code>, <code>trojan://</code></p>
    <p class="note">Parsing sepenuhnya di browser — tidak ada data dikirim ke server.</p>
  </div>

  <div class="foot">
    <span id="footDomain">...</span> &middot; Banten IT Solutions
  </div>
</div>

<script>
document.getElementById("footDomain").textContent = location.hostname;

document.getElementById("convertBtn").addEventListener("click", () => {
  const input = document.getElementById("input").value.trim();
  if (!input) {
    alert("Paste URL vless:// dulu!");
    return;
  }

  const lines = input.split("\n").filter(l => l.trim());
  const proxies = [];
  const errors = [];

  lines.forEach((line, i) => {
    try {
      const proxy = parseVlessUrl(line.trim());
      if (proxy) proxies.push(proxy);
    } catch (e) {
      errors.push(`Line ${i+1}: ${e.message}`);
    }
  });

  if (proxies.length === 0) {
    alert("Tidak ada URL valid yang bisa di-parse!");
    return;
  }

  const yaml = generateClashYaml(proxies);
  document.getElementById("output").value = yaml;
  document.getElementById("summary").textContent = `Valid: ${proxies.length} | Invalid: ${errors.length}`;
  document.getElementById("outputCard").style.display = "block";
  document.getElementById("outputCard").scrollIntoView({ behavior: "smooth" });
});

document.getElementById("copyBtn").addEventListener("click", () => {
  navigator.clipboard.writeText(document.getElementById("output").value);
  document.getElementById("copyBtn").textContent = "Tersalin!";
  setTimeout(() => document.getElementById("copyBtn").textContent = "Copy YAML", 1500);
});

document.getElementById("downloadBtn").addEventListener("click", () => {
  const blob = new Blob([document.getElementById("output").value], { type: "text/yaml" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "clash.yaml";
  a.click();
  URL.revokeObjectURL(url);
});

function parseVlessUrl(urlStr) {
  // Format: vless://uuid@server:port?params#remark
  if (!urlStr.startsWith("vless://") && !urlStr.startsWith("vmess://") && !urlStr.startsWith("trojan://")) {
    throw new Error("Unsupported protocol");
  }

  const protocol = urlStr.split("://")[0];
  const rest = urlStr.substring(protocol.length + 3);
  
  const hashIndex = rest.indexOf("#");
  const remark = hashIndex !== -1 ? decodeURIComponent(rest.substring(hashIndex + 1)) : "Proxy";
  const withoutHash = hashIndex !== -1 ? rest.substring(0, hashIndex) : rest;
  
  const qIndex = withoutHash.indexOf("?");
  const [userHost, queryStr] = qIndex !== -1 ? [withoutHash.substring(0, qIndex), withoutHash.substring(qIndex + 1)] : [withoutHash, ""];
  
  const atIndex = userHost.lastIndexOf("@");
  const uuid = userHost.substring(0, atIndex);
  const serverPort = userHost.substring(atIndex + 1);
  const [server, port] = serverPort.split(":");
  
  const params = new URLSearchParams(queryStr);
  
  return {
    type: protocol,
    name: remark,
    server,
    port: port || "443",
    uuid,
    security: params.get("security") || "tls",
    sni: params.get("sni") || params.get("host") || server,
    host: params.get("host") || server,
    path: decodeURIComponent(params.get("path") || "/"),
    network: params.get("type") || "ws",
  };
}

function generateClashYaml(proxies) {
  const lines = proxies.map(p => {
    const tls = p.security === "tls";
    return `  - name: ${p.name}
    server: ${p.server}
    port: ${p.port}
    type: ${p.type}
    uuid: ${p.uuid}
    cipher: auto
    tls: ${tls}
    skip-cert-verify: true
    servername: ${p.sni}
    network: ${p.network}
    ws-opts:
      path: ${p.path}
      headers:
        Host: ${p.host}
    udp: true`;
  });
  
  return `proxies:\n${lines.join("\n")}`;
}
</script>
</body>
</html>
