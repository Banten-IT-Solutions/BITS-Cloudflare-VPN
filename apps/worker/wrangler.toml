name = "bits-vpn"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ── Static assets (frontend build output) ────────────────────────────────
# Points at apps/web/dist (relative to this file: ../../web/dist)
[assets]
directory = "../web/dist"
binding = "ASSETS"

# ── D1 database ───────────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "vpn"
database_id = "your-d1-database-id"
migrations_dir = "d1/migrations"

# ── KV cache ──────────────────────────────────────────────────────────────
[[kv_namespaces]]
binding = "KV"
id = "your-kv-namespace-id"

# ── Tunnels registered as custom domains ──────────────────────────────────
routes = [
  { pattern = "vpn.bits.co.id", custom_domain = true },
  { pattern = "support.zoom.us.vpn.bits.co.id", custom_domain = true },
]

[observability]
enabled = true