name: 🛰️ Proxy Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: proxy-scan
  cancel-in-progress: false

jobs:
  scanner:
    name: ✅ Scan & update proxy list
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: 🏞️ Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      - name: 🟣 Setup Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: 👀 Start scan
        env:
          SKIP_SIMPLE_GIT_HOOKS: "1"
        run: |
          echo "::notice::🛰️ Scanning proxy list ..."
          bun install --frozen-lockfile
          bun run ./scan.ts

      - name: 📤 Publish result
        if: ${{ success() }}
        env:
          SKIP_SIMPLE_GIT_HOOKS: "1"
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "::notice::✅ No changes in proxy list, nothing to commit"
            exit 0
          fi
          git commit --no-verify -m "Update proxy list"
          echo "::notice::📤 Proxy list updated and published"
          # Rebase di atas main terbaru (untuk menghindari "stale info" ketika
          # ada commit lain yang sudah masuk sebelum workflow ini selesai)
          git fetch origin main
          git rebase origin/main
          git push --no-verify origin main
