name: 🚀 Deploy Cloudflare
run-name: Deploy ${{ inputs.environment || 'prod' }} @ ${{ inputs.commit || github.sha }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Wrangler environment to deploy to'
        required: true
        default: 'prod'
        type: choice
        options:
        - dev
        - prod
        - one
      commit:
        description: 'Git tip commit to deploy'
        default: 'main'
        required: true

permissions:
  contents: read

env:
  GIT_REF: ${{ github.event.inputs.commit || github.ref }}
  # empty string means the default (no) environment on Workers
  WORKERS_ENV: ''

jobs:
  deploy:
    name: ✅ Deploy worker to Cloudflare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: deploy-cf-worker
      cancel-in-progress: false

    steps:
      - name: 🏞️ Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.GIT_REF }}
          fetch-depth: 0

      - name: 🔧 Resolve environment (prod/one)
        # 'dev' deploys to the default (empty) worker environment
        if: github.event.inputs.environment == 'prod' || github.event.inputs.environment == 'one'
        run: |
          echo "WORKERS_ENV=${WENV}" >> "$GITHUB_ENV"
          echo "COMMIT_SHA=${COMMIT_SHA}" >> "$GITHUB_ENV"
          echo "::notice::🌍 Environment set to ${WENV} (commit ${COMMIT_SHA})"
        shell: bash
        env:
          WENV: ${{ github.event.inputs.environment }}
          COMMIT_SHA: ${{ github.sha }}

      - name: 🏷️ Resolve environment from git tag
        # tagged releases always deploy to production
        if: github.ref_type == 'tag'
        run: |
          echo "WORKERS_ENV=${WENV}" >> "$GITHUB_ENV"
          echo "COMMIT_SHA=${COMMIT_SHA}" >> "$GITHUB_ENV"
          echo "::notice::🏷️ Tag detected -> production deploy (${COMMIT_SHA})"
        shell: bash
        env:
          WENV: 'prod'
          COMMIT_SHA: ${{ github.sha }}

      - name: 📚 Publish worker (wrangler)
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          environment: ${{ env.WORKERS_ENV }}
        env:
          # wrangler-action reads GIT_COMMIT_ID for version metadata
          GIT_COMMIT_ID: ${{ env.GIT_REF }}

      - name: 🎉 Deployment summary
        run: |
          echo "::notice::🚀 Deployed ${GIT_REF}@${COMMIT_SHA} to environment '${WORKERS_ENV:-default}'"