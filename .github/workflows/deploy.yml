name: 🚀 Deploy Cloudflare
run-name: Deploy ${{ inputs.ref || github.sha }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch/tag/commit) to deploy'
        default: 'main'
        required: false

permissions:
  contents: read

env:
  GIT_REF: ${{ github.event.inputs.ref || github.sha }}

jobs:
  deploy:
    name: ✅ Deploy worker to Cloudflare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: deploy-cf-worker
      cancel-in-progress: false

    steps:
      - name: 🏞️ Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.GIT_REF }}
          fetch-depth: 0

      - name: 📚 Publish worker (wrangler)
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        env:
          GIT_COMMIT_ID: ${{ env.GIT_REF }}

      - name: 🎉 Deployment summary
        run: |
          echo "::notice::🚀 Deployed ${GIT_REF} to Cloudflare Workers (name=yuliana.my.id + *.yuliana.my.id)"