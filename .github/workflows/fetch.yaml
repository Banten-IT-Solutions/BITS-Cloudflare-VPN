name: 🔄 Weekly Proxy Fetch & Scan

on:
  schedule:
    - cron: "0 0 * * 0" # Berjalan setiap hari Minggu pukul 00:00 UTC
  workflow_dispatch: # Memungkinkan eksekusi manual via GitHub UI

permissions:
  contents: write

concurrency:
  group: proxy-fetch-scan
  cancel-in-progress: false

jobs:
  fetch-and-scan:
    name: ✅ Fetch Clean IPs & Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: 🏞️ Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      - name: 🟣 Setup Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🌐 Fetch clean IPs
        run: |
          echo "::notice::🌐 Fetching clean Cloudflare IPs..."
          bun run fetch

      - name: 🛰️ Scan proxies
        run: |
          echo "::notice::🛰️ Scanning proxy list..."
          bun run scan

      - name: 📤 Publish results to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw.txt proxy.txt KV.json
          
          if git diff --cached --quiet; then
            echo "::notice::✅ No changes detected in proxies database"
            exit 0
          fi
          
          git commit -m "chore(cron): weekly clean IP fetch and proxy scan update"
          echo "::notice::📤 Publishing updated proxy lists..."
          git fetch origin main
          git rebase origin/main
          git push origin main
