name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: bunx wrangler deploy --dry-run --config apps/worker/wrangler.jsonc
      - run: bunx wrangler deploy --dry-run --config apps/scanner-worker/wrangler.jsonc

  deploy:
    name: Deploy Workers
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run --filter @bits-vpn/shared build
      - run: bun run --filter @bits-vpn/web build
      - name: Apply D1 migrations
        run: bunx wrangler d1 migrations apply vpn --remote --config wrangler.jsonc
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy proxy worker
        run: bunx wrangler deploy --config wrangler.jsonc
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy scanner worker
        run: bunx wrangler deploy --config wrangler.jsonc
        working-directory: apps/scanner-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
