name = "vpn"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat_v2"]

[vars]
PRX_BANK_URL = "https://raw.githubusercontent.com/Banten-IT-Solutions/BITS-Cloudflare-VPN/main/proxy.txt"

[assets]
directory = "./assets"
binding = "ASSETS"

# Domain utama (custom domain) -> DNS + sertifikat dibuat otomatis oleh Cloudflare
[[routes]]
pattern = "yuliana.my.id"
custom_domain = true

# SNI-trick hostname: custom domain eksak agar SSL SAN persis hostname ini muncul,
# sehingga koneksi SSL/TLS dengan SNI support.zoom.us.yuliana.my.id diterima oleh edge
# (Universal SSL/wildcard hanya men-cover 1 level => tidak cukup untuk 3 level).
[[routes]]
pattern = "support.zoom.us.yuliana.my.id"
custom_domain = true

[unsafe.metadata.observability]
enabled = true

[observability.logs]
enabled = true