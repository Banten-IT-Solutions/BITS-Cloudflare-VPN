name = "vpn"
main = "worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat_v2"]

[vars]
PRX_BANK_URL = "https://raw.githubusercontent.com/bitscoid/BITS-Cloudflare-VPN/main/proxy.txt"

# Domain utama (custom domain) -> DNS + sertifikat dibuat otomatis oleh Cloudflare
[[routes]]
pattern = "yuliana.my.id"
custom_domain = true

# Wildcard semua subdomain -> pakai route zone (Custom Domain tidak mendukung wildcard)
[[routes]]
pattern = "*.yuliana.my.id/*"
zone_name = "yuliana.my.id"

[unsafe.metadata.observability]
enabled = true

[observability.logs]
enabled = true